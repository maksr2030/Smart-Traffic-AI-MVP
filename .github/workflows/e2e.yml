name: Executable Platform E2E

on:
  push:
    branches: [feature/unified-traffic-mvp-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry and unit tests
        run: |
          npm run validate
          npm test
          npm run check
      - name: Build the exact executable site
        run: node scripts/build-executable-site-v190.mjs site
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.60.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop Chromium and mobile WebKit E2E
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
