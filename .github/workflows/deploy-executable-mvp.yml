name: Deploy Executable Smart Traffic MVP from Feature Branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-executable-mvp.yml']
  workflow_run:
    workflows: ["Smart Traffic MVP CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy-feature-mvp:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feature/unified-traffic-mvp-v1')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout executable MVP feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-traffic-mvp-v1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry and evidence
        run: npm run validate
      - name: Run automated tests
        run: npm test
      - name: Check executable wiring
        run: npm run check
      - name: Prepare acquisition decision room executable site
        run: |
          mkdir -p site
          cp index.html styles.css acquisition.css guidedDemo.css decisionRoom.css app.js v18Runtime.js acquisitionRuntime.js decisionRoomRuntime.js site/
          cp guidedDemoRuntime.v183.js site/guidedDemoRuntime.js
          cp -R engine coverage data site/
          node scripts/prepare-runtime-sync-v183.mjs site
          node --check site/app.js
          node --check site/v18Runtime.js
          node --check site/acquisitionRuntime.js
          node --check site/guidedDemoRuntime.js
          node --check site/decisionRoomRuntime.js
          grep -q 'window.smartTrafficRuntime' site/app.js
          grep -q 'smart-traffic:ready' site/app.js
          grep -q 'useLive?live.network' site/v18Runtime.js
          grep -q 'waitForCoreReady' site/acquisitionRuntime.js
          grep -q 'tour.executed.add(action)' site/guidedDemoRuntime.js
          grep -q 'acquisitionDecisionRoom' site/guidedDemoRuntime.js
          grep -q 'acquisitionDecisionRoom' site/decisionRoomRuntime.js
          grep -q 'production_verified' site/decisionRoomRuntime.js
          grep -q 'MVP → PRODUCTION' site/decisionRoomRuntime.js
          grep -q 'overflow-y:auto' site/acquisition.css
          grep -q 'position:fixed;left:12px;right:12px' site/acquisition.css
          grep -q '@media(max-width:780px)' site/decisionRoom.css
          python - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          css_anchor = '<link rel="stylesheet" href="styles.css">'
          app_anchor = '<script type="module" src="app.js"></script>'
          v18_anchor = '<script type="module" src="v18Runtime.js"></script>'
          if css_anchor not in html or app_anchor not in html or v18_anchor not in html:
              raise SystemExit('Executable page injection anchors missing')
          html = html.replace(css_anchor, '<link rel="stylesheet" href="styles.css?v=185">\n  <link rel="stylesheet" href="acquisition.css?v=185">\n  <link rel="stylesheet" href="guidedDemo.css?v=185">\n  <link rel="stylesheet" href="decisionRoom.css?v=185">', 1)
          html = html.replace(app_anchor, '<script type="module" src="app.js?v=185"></script>', 1)
          html = html.replace(v18_anchor, '<script type="module" src="v18Runtime.js?v=185"></script>\n<script type="module" src="acquisitionRuntime.js?v=185"></script>\n<script type="module" src="decisionRoomRuntime.js?v=185"></script>\n<script type="module" src="guidedDemoRuntime.js?v=185"></script>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'app.js?v=185' site/index.html
          grep -q 'v18Runtime.js?v=185' site/index.html
          grep -q 'acquisitionRuntime.js?v=185' site/index.html
          grep -q 'decisionRoomRuntime.js?v=185' site/index.html
          grep -q 'guidedDemoRuntime.js?v=185' site/index.html
          grep -q 'decisionRoom.css?v=185' site/index.html
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
