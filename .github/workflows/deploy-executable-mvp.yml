name: Deploy Executable Smart Traffic MVP from Feature Branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-executable-mvp.yml']
  workflow_run:
    workflows: ["Smart Traffic MVP CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy-feature-mvp:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feature/unified-traffic-mvp-v1')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout executable MVP feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-traffic-mvp-v1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry and evidence
        run: npm run validate
      - name: Run automated tests
        run: npm test
      - name: Check executable wiring
        run: npm run check
      - name: Prepare acquisition-ready guided executable site
        run: |
          mkdir -p site
          cp index.html styles.css acquisition.css guidedDemo.css app.js v18Runtime.js acquisitionRuntime.js guidedDemoRuntime.js site/
          cp -R engine coverage data site/
          python - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          css_anchor = '<link rel="stylesheet" href="styles.css">'
          js_anchor = '<script type="module" src="v18Runtime.js"></script>'
          if css_anchor not in html or js_anchor not in html:
              raise SystemExit('Executable page injection anchors missing')
          html = html.replace(css_anchor, css_anchor + '\n  <link rel="stylesheet" href="acquisition.css">\n  <link rel="stylesheet" href="guidedDemo.css">', 1)
          html = html.replace(js_anchor, js_anchor + '\n<script type="module" src="acquisitionRuntime.js"></script>\n<script type="module" src="guidedDemoRuntime.js"></script>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'acquisitionRuntime.js' site/index.html
          grep -q 'acquisition.css' site/index.html
          grep -q 'guidedDemoRuntime.js' site/index.html
          grep -q 'guidedDemo.css' site/index.html
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
